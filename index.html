<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruleta</title>
  <meta name="theme-color" content="#7b00b8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ruleta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

<style>
/* ============================================================
   CONFIGURACIÓN VISUAL — cambia aquí lo que no te guste
   ============================================================ */
:root {
  /* ---------- Colores de las casillas ---------- */
  --color-cero: #e63946;              /* Color de fondo del 0 (rojo) */
  --color-uno: #ffcf3f;               /* Color de fondo del 1 (amarillo) */
  --color-dos: #3d7bff;               /* Color de fondo del 2 (azul) */
  --color-tres: #47b881;              /* Color de fondo del 3 (verde) */
  --color-separador: #000000;         /* Color de las líneas entre casillas */

  /* ---------- Ruleta ---------- */
  --tamano-ruleta: min(82vmin, 560px);/* Tamaño de la ruleta */
  --color-borde: #000000;             /* Color de los anillos negros del borde */
  --grosor-bordes-negros: 7px;        /* Grosor de los anillos negros del borde (exterior e interior, siempre igual) */
  --color-aro-blanco: #ffffff;        /* Color del anillo blanco del borde */
  --grosor-aro-blanco: 14px;          /* Grosor del anillo blanco del borde */
  --grosor-separador: 3px;            /* Grosor de las líneas entre casillas */
  --transparencia-separador: 0.85;    /* Transparencia de las líneas entre casillas (0 a 1) */
  --tamano-centro: 19%;               /* Tamaño del círculo central (% de la ruleta) */
  --color-centro: #ffffff;            /* Color del círculo central */
  --color-centro-borde: #000000;      /* Color del borde del círculo central (chocolate) */
  --color-texto-centro: #000000;      /* Color del texto del centro ("Gírame") */
  --distancia-numeros: calc(var(--tamano-ruleta) * 0.36); /* Distancia de los números al centro */
  --tamano-numeros: 24px;             /* Tamaño de los números de las casillas */
  --color-texto-numeros: #ffffff;     /* Color de los números */
  --color-puntero: #1f1f1f;           /* Color del marcador negro */
  --tamano-puntero: 38px;             /* Largo del marcador negro */

  /* ---------- Fondo ---------- */
  --imagen-fondo: url('background.jpeg'); /* Imagen de fondo de la página */
  --color-fondo: #fef6fa;             /* Color de fondo mientras carga la imagen (o si no existe) */

  /* ---------- Textos ---------- */
  --fuente: 'Comic Sans MS', 'Chalkboard SE', 'Trebuchet MS', sans-serif; /* Letra de toda la página */
  --color-titulo: #000000;            /* Color del título */
  --tamano-titulo: clamp(20px, 4vmin, 32px); /* Tamaño del título */

  /* ---------- Cartel del resultado (modal) ---------- */
  --color-modal: #ffffff;             /* Color de fondo del cartel */
  --color-texto-modal: #000000;       /* Color del texto del cartel */
  --tamano-titulo-modal: 24px;        /* Tamaño del texto "Ha salido…" */
  --tamano-numero-modal: 90px;        /* Tamaño del número del resultado */
  --redondeo-modal: 26px;             /* Redondeo de las esquinas del cartel */
  --color-boton: #ff8fb1;             /* Color del botón Cerrar */
  --color-boton-texto: #ffffff;       /* Color del texto del botón Cerrar */
  --tamano-boton: 20px;               /* Tamaño de la letra del botón Cerrar */
}

/* ============================================================
   ESTILOS (normalmente no necesitas tocar nada de aquí abajo)
   ============================================================ */
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  overflow: hidden;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  font-family: var(--fuente);
  background-color: var(--color-fondo);
  background-image: var(--imagen-fondo);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

.titulo {
  margin: 0;
  font-size: var(--tamano-titulo);
  color: var(--color-titulo);
  letter-spacing: 1px;
}

.marco {
  position: relative;
  width: var(--tamano-ruleta);
  height: var(--tamano-ruleta);
}

.rueda {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: var(--grosor-bordes-negros) solid var(--color-borde);
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.18);
  will-change: transform;
}

.rueda::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  border: var(--grosor-aro-blanco) solid var(--color-aro-blanco);
  box-shadow: inset 0 0 0 var(--grosor-bordes-negros) var(--color-borde);
  pointer-events: none;
}

.linea {
  position: absolute;
  left: 50%;
  bottom: 50%;
  width: var(--grosor-separador);
  height: 50%;
  background: var(--color-separador);
  opacity: var(--transparencia-separador);
  transform-origin: bottom center;
  pointer-events: none;
}

.numero {
  position: absolute;
  left: 50%;
  top: 50%;
  font-size: var(--tamano-numeros);
  font-weight: bold;
  color: var(--color-texto-numeros);
  text-shadow: 0 2px 3px rgba(0, 0, 0, 0.35);
  pointer-events: none;
}

.centro {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: var(--tamano-centro);
  height: var(--tamano-centro);
  border-radius: 50%;
  background: var(--color-centro);
  border: calc(var(--tamano-ruleta) * 0.012) solid var(--color-centro-borde);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.20);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-weight: bold;
  color: var(--color-texto-centro);
  text-align: center;
  line-height: 1.05;
  z-index: 4;
}

.puntero {
  position: absolute;
  top: 50%;
  right: calc(var(--tamano-puntero) * -0.35);
  transform: translateY(-50%);
  width: 0;
  height: 0;
  border-top: calc(var(--tamano-puntero) * 0.42) solid transparent;
  border-bottom: calc(var(--tamano-puntero) * 0.42) solid transparent;
  border-right: var(--tamano-puntero) solid var(--color-puntero);
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.35));
  z-index: 5;
}

.modal-fondo {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(91, 58, 29, 0.45);
  z-index: 50;
}

.oculto { display: none !important; }

.modal {
  background: var(--color-modal);
  border-radius: var(--redondeo-modal);
  padding: 30px 46px;
  text-align: center;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.25);
}

.modal-titulo {
  margin: 0 0 10px;
  font-size: var(--tamano-titulo-modal);
  font-weight: bold;
  color: var(--color-texto-modal);
}

.modal-numero {
  display: block;
  width: max-content;
  margin: 0 auto 22px;
  padding: 4px 30px;
  border-radius: 20px;
  font-size: var(--tamano-numero-modal);
  font-weight: bold;
  line-height: 1.15;
  background: #999999;
  color: #ffffff;
}

.modal-boton {
  font-family: inherit;
  font-size: var(--tamano-boton);
  font-weight: bold;
  border: none;
  border-radius: 999px;
  padding: 12px 40px;
  background: var(--color-boton);
  color: var(--color-boton-texto);
  cursor: pointer;
}

.modal-boton:active { transform: scale(0.96); }
</style>
</head>
<body>

<h1 class="titulo"></h1>

<div class="marco">
  <div class="rueda" id="rueda"></div>
  <div class="centro" id="centro"></div>
  <div class="puntero"></div>
</div>

<div class="modal-fondo oculto" id="modalFondo" role="dialog" aria-modal="true">
  <div class="modal">
    <p class="modal-titulo">Ha salido&hellip;</p>
    <div class="modal-numero" id="modalNumero">0</div>
    <button class="modal-boton" id="botonCerrar" type="button">Cerrar</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN DEL GIRO Y DE LAS CASILLAS — cambia aquí lo que no te guste
   ============================================================ */

// Orden de los números de la ruleta: empieza arriba (las 12) y sigue en el sentido horario
const ORDEN_SEGMENTOS = [
  1, 2, 3, 2, 2, 1, 2, 2, 1, 2, 3, 2,
  2, 1, 2, 2, 1, 2, 2, 3, 2, 2, 1, 2,
  2, 0, 2, 2
];

// Color de cada número (los valores están arriba, en la configuración del CSS)
const COLORES = {
  0: 'var(--color-cero)',
  1: 'var(--color-uno)',
  2: 'var(--color-dos)',
  3: 'var(--color-tres)'
};

// Color de la letra del resultado según el número (el amarillo necesita letra oscura para leerse bien)
const COLOR_TEXTO_RESULTADO = { 0: '#ffffff', 1: '#6b4b00', 2: '#ffffff', 3: '#ffffff' };

// Texto que aparece en el centro de la ruleta
const TEXTO_CENTRO = 'Giro dulce';

// Tamaño de la letra del centro, como proporción del tamaño de la ruleta (0.045 = un 4,5%; se encoge sola si no cabe)
const TAMANO_LETRA_CENTRO = 0.045;

// Sonido de tic-tac mientras gira (true = activado, false = desactivado)
const SONIDO = true;

// Volumen del sonido, de 0 a 1
const VOLUMEN = 0.15;

// Vueltas completas mínimo y máximo que da la ruleta al girar
const VUELTAS_MINIMAS = 5;
const VUELTAS_MAXIMAS = 9;

// Duración del giro, en segundos
const DURACION_GIRO = 15;

// Velocidad de la ruleta cuando está en reposo, en grados por segundo (muy muy lenta)
const VELOCIDAD_REPOSO = 7;

// Segundos que espera desde que para hasta que aparece el cartel con el resultado
const PAUSA_ANTES_MODAL = 0.4;

/* ============================================================
   CÓDIGO DE LA RULETA (no necesitas tocar nada de aquí abajo)
   ============================================================ */
const rueda = document.getElementById('rueda');
const centroEl = document.getElementById('centro');
const modalFondo = document.getElementById('modalFondo');
const modalNumero = document.getElementById('modalNumero');
const botonCerrar = document.getElementById('botonCerrar');

let angulo = Math.random() * 360;
let estado = 'reposo';
let tiempoAnterior = null;
let inicioAngulo = 0;
let objetivo = 0;
let progreso = 0;
let ultimaCasillaSonada = -1;
let contextoAudio = null;

construirRuleta();
pintar();
requestAnimationFrame(animar);

function construirRuleta() {
  const trozo = 360 / ORDEN_SEGMENTOS.length;
  const paradas = [];

  ORDEN_SEGMENTOS.forEach(function (numero, i) {
    const inicio = i * trozo;
    const fin = (i + 1) * trozo;
    paradas.push(
      COLORES[numero] + ' ' + inicio + 'deg',
      COLORES[numero] + ' ' + fin + 'deg'
    );

    const linea = document.createElement('div');
    linea.className = 'linea';
    linea.style.transform = 'translateX(-50%) rotate(' + inicio + 'deg)';
    rueda.appendChild(linea);

    const etiqueta = document.createElement('span');
    etiqueta.className = 'numero';
    etiqueta.textContent = numero;
    etiqueta.style.transform =
      'translate(-50%, -50%) rotate(' + (inicio + trozo / 2) + 'deg) translateY(calc(-1 * var(--distancia-numeros)))';
    rueda.appendChild(etiqueta);
  });

  rueda.style.backgroundImage = 'conic-gradient(' + paradas.join(', ') + ')';
  centroEl.textContent = TEXTO_CENTRO;
  ajustarTextoCentro();
  window.addEventListener('resize', ajustarTextoCentro);
}

function ajustarTextoCentro() {
  let tamano = rueda.clientWidth * TAMANO_LETRA_CENTRO;
  centroEl.style.fontSize = tamano + 'px';
  let guardia = 0;
  while ((centroEl.scrollWidth > centroEl.clientWidth || centroEl.scrollHeight > centroEl.clientHeight) && guardia < 80) {
    tamano *= 0.94;
    centroEl.style.fontSize = tamano + 'px';
    guardia++;
  }
}

function pintar() {
  rueda.style.transform = 'rotate(' + angulo + 'deg)';
}

function animar(ahora) {
  if (tiempoAnterior === null) tiempoAnterior = ahora;
  const delta = Math.min((ahora - tiempoAnterior) / 1000, 0.05);
  tiempoAnterior = ahora;

  if (estado === 'reposo') {
    angulo = (angulo + VELOCIDAD_REPOSO * delta) % 360;
    pintar();
  } else if (estado === 'girando') {
    progreso += delta / DURACION_GIRO;
    if (progreso >= 1) progreso = 1;
    const suavizado = 1 - Math.pow(1 - progreso, 3);
    angulo = inicioAngulo + (objetivo - inicioAngulo) * suavizado;
    pintar();
    sonarCruce();
    if (progreso >= 1) terminarGiro();
  }

  requestAnimationFrame(animar);
}

function girar() {
  estado = 'girando';
  progreso = 0;
  inicioAngulo = angulo;
  ultimaCasillaSonada = -1;
  prepararSonido();
  const vueltas = VUELTAS_MINIMAS + Math.random() * (VUELTAS_MAXIMAS - VUELTAS_MINIMAS);
  objetivo = angulo + vueltas * 360 + Math.random() * 360;
}

function sonarCruce() {
  if (!SONIDO) return;
  const trozo = 360 / ORDEN_SEGMENTOS.length;
  const indice = Math.floor((((angulo % 360) + 360) % 360) / trozo);
  if (indice === ultimaCasillaSonada) return;
  ultimaCasillaSonada = indice;
  sonarTic();
}

function prepararSonido() {
  if (!SONIDO) return;
  if (!contextoAudio) {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    contextoAudio = new AudioCtx();
  }
  if (contextoAudio.state === 'suspended') contextoAudio.resume();
}

function sonarTic() {
  const ctx = contextoAudio;
  if (!ctx || ctx.state !== 'running') return;
  const tiempo = ctx.currentTime;
  const oscilador = ctx.createOscillator();
  const ganancia = ctx.createGain();
  oscilador.type = 'square';
  oscilador.frequency.value = 1400;
  ganancia.gain.setValueAtTime(VOLUMEN, tiempo);
  ganancia.gain.exponentialRampToValueAtTime(0.0001, tiempo + 0.04);
  oscilador.connect(ganancia);
  ganancia.connect(ctx.destination);
  oscilador.start(tiempo);
  oscilador.stop(tiempo + 0.05);
}

function terminarGiro() {
  estado = 'esperando';
  angulo = ((angulo % 360) + 360) % 360;
  pintar();
  const numero = segmentoEnPuntero();
  setTimeout(function () {
    mostrarResultado(numero);
  }, PAUSA_ANTES_MODAL * 1000);
}

function segmentoEnPuntero() {
  const trozo = 360 / ORDEN_SEGMENTOS.length;
  const posicion = (((90 - angulo) % 360) + 360) % 360;
  return ORDEN_SEGMENTOS[Math.floor(posicion / trozo)];
}

function mostrarResultado(numero) {
  modalNumero.textContent = numero;
  modalNumero.style.background = COLORES[numero];
  modalNumero.style.color = COLOR_TEXTO_RESULTADO[numero];
  modalFondo.classList.remove('oculto');
}

document.addEventListener('pointerdown', function () {
  if (estado !== 'reposo') return;
  if (!modalFondo.classList.contains('oculto')) return;
  girar();
});

botonCerrar.addEventListener('click', function () {
  modalFondo.classList.add('oculto');
  estado = 'reposo';
});
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
        console.warn('No se pudo registrar el modo offline:', error);
      });
    });
  }
</script>
</body>
</html>
